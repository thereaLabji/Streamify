<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d18">
  <meta name="description" content="Sign in to Streamify with a one-time pairing code from Streamify Core.">
  <title>Sign in · Streamify</title>
  <style>
    :root{color-scheme:dark;--bg:#090d18;--panel:#111b2c;--line:#263750;--text:#edf3ff;--muted:#9aabc5;--blue:#83b2ff;--blue2:#668ff5;--red:#ff8793;--green:#54d9a0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% -15%,#203b66 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .shell{width:min(440px,100%)}.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:25px;font-size:21px;font-weight:800;letter-spacing:-.6px}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#76b4ff,#987bff);color:#08101e;font-weight:950}
    .card{padding:30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#152238f5,#101827f5);box-shadow:0 28px 90px #0006}.eyebrow{text-align:center;color:var(--blue);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{margin:9px 0 7px;text-align:center;font-size:29px;letter-spacing:-1px}.intro{text-align:center;color:var(--muted);margin:0 0 25px;font-size:14px}
    label{display:block;margin-bottom:8px;font-size:13px;font-weight:700}.code{width:100%;height:58px;padding:0 12px;border:1px solid #344762;border-radius:12px;background:#0a1322;color:var(--text);font:700 22px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:3px;text-align:center;outline:none}.code:focus{border-color:var(--blue);box-shadow:0 0 0 3px #83b2ff22}.hint{margin:8px 0 19px;color:var(--muted);font-size:12px}
    button{width:100%;height:48px;border:0;border-radius:12px;background:linear-gradient(100deg,#75b2ff,#8e87ff);color:#08101e;font-size:14px;font-weight:850;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{display:none;margin-top:15px;padding:11px 13px;border-radius:10px;font-size:13px}.message.error{display:block;color:#ffd6da;background:#6e273244;border:1px solid #a943534d}.message.success{display:block;color:#baf4d9;background:#174a3544;border:1px solid #3c9b704d}.foot{display:flex;justify-content:center;gap:18px;margin-top:20px;font-size:12px}.foot a{color:var(--muted);text-decoration:none}.foot a:hover{color:var(--blue)}.security{margin:20px 2px 0;color:#7f91ad;text-align:center;font-size:11px}
    @media(max-width:480px){.card{padding:24px 20px}h1{font-size:26px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark">S</span><span>Streamify</span></div>
    <section class="card">
      <div class="eyebrow">Streamer access</div>
      <h1>Welcome back.</h1>
      <p class="intro">Pair this browser with your running Streamify Core.</p>
      <form id="loginForm">
        <label for="pairingCode">16-digit pairing code</label>
        <input class="code" id="pairingCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="16" minlength="16" pattern="[0-9]{16}" placeholder="0000000000000000" required aria-describedby="codeHint">
        <p class="hint" id="codeHint">Generate a fresh code from Streamify Core. Codes expire after 5 minutes and work once.</p>
        <button id="submitButton" type="submit">Connect Streamify account</button>
        <div class="message" id="message" role="status" aria-live="polite"></div>
      </form>
    </section>
    <nav class="foot"><a href="./status.html">Public stream status</a><a href="https://github.com/thereaLabji/Streamify">GitHub</a></nav>
    <p class="security">Pairing codes are one-time credentials. Never share them with anyone.</p>
  </main>
<script>
(() => {
  const API = "https://streamify-public-api.streamify-app.workers.dev";
  const form = document.getElementById("loginForm");
  const input = document.getElementById("pairingCode");
  const button = document.getElementById("submitButton");
  const message = document.getElementById("message");
  function show(text, kind) {
    message.textContent = text;
    message.className = "message " + kind;
  }
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0, 16);
    message.className = "message";
  });
  form.addEventListener("submit", async event => {
    event.preventDefault();
    const code = input.value.trim();
    if (!/^\d{16}$/.test(code)) {
      show("Enter all 16 digits from Streamify Core.", "error");
      input.focus();
      return;
    }
    button.disabled = true;
    button.textContent = "Connecting…";
    message.className = "message";
    try {
      const response = await fetch(API + "/v1/pairing/exchange", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({code}),
        cache: "no-store"
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        const errors = {
          invalid_or_expired_code: "That code is invalid, expired, or already used. Generate a new one in Streamify Core.",
          invalid_pairing_code: "The code format is invalid. Enter exactly 16 digits.",
          rate_limited: "Too many attempts. Wait a little before trying again."
        };
        throw new Error(errors[result.error] || "Could not sign in. Please generate a new pairing code and try again.");
      }
      if (typeof result.sessionToken !== "string" || !result.sessionToken) {
        throw new Error("The server did not return a session. Please try again.");
      }
      sessionStorage.setItem("streamify_session", result.sessionToken);
      sessionStorage.setItem("streamify_session_expiry", result.expiresAt || "");
      show("Connected. Opening your dashboard…", "success");
      input.value = "";
      window.location.replace("./dashboard.html");
    } catch (error) {
      show(error.message || "Connection failed. Check your internet connection and try again.", "error");
    } finally {
      button.disabled = false;
      button.textContent = "Connect Streamify account";
    }
  });
})();
</script>
</body>
</html>
